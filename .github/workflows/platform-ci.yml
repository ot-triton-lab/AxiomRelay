name: Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-macos:
    # This file is authored in the private release-source repository and then
    # exported verbatim. Only the sanitized public repository runs platform CI.
    if: github.repository == 'ot-triton-lab/AxiomRelay'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6

      - name: Install Bash 5 on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Codex without invoking a model
        run: npm install --global @openai/codex

      - name: Create clean Python environments
        run: |
          python -m venv agents/verification/.venv
          agents/verification/.venv/bin/pip install \
            -r agents/verification/requirements.txt
          python -m venv --copies --without-pip agents/.generation-venv
          uv pip install --python agents/.generation-venv/bin/python \
            -r agents/generation/requirements-dev.txt

      - name: Clean-install and generated-source checks
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          agents/verification/.venv/bin/python -I -B -c \
            'import sys; sys.path.insert(0, "agents/verification"); import api.server'
          agents/.generation-venv/bin/python -B \
            agents/generation/mcp/build_legacy_server.py --check
          bash -n agents/generation/tests/run_example.sh
          bash -n agents/generation/tests/run_claude_core.sh
          bash -n agents/generation/tests/run_legacy.sh
          bash -n agents/generation/tests/run_hotjoin.sh
          bash -n agents/verification/scripts/run_verifier.sh

      - name: Exercise the native Codex permission profile
        run: |
          diagnostic_log="$RUNNER_TEMP/axiom-relay-sandbox.log"
          set +e
          (
            set -x
            uname -a
            codex --version
            probe_root="$RUNNER_TEMP/axiom-relay-sandbox"
            mkdir -p "$probe_root/allowed" "$probe_root/denied"
            printf ok > "$probe_root/allowed/input"
            printf no > "$probe_root/denied/secret"
            codex_path="$(python -c 'import pathlib,shutil; print(pathlib.Path(shutil.which("codex")).resolve())')"
            filesystem="$(python -c 'import json,sys; root,codex=sys.argv[1:]; print("{\":minimal\"=\"read\","+json.dumps(codex)+"=\"read\","+json.dumps(root+"/allowed")+"=\"write\","+json.dumps(root+"/denied")+"=\"deny\"}")' "$probe_root" "$codex_path")"
            # GitHub's hosted Ubuntu policy may stop bubblewrap at namespace
            # setup. Enabling network avoids an earlier loopback-only failure;
            # the exact hosted-runner denials are handled below. macOS still
            # exercises the complete profile with networking disabled.
            network_enabled=false
            if [[ "$RUNNER_OS" == Linux ]]; then
              network_enabled=true
            fi
            codex sandbox --permission-profile axiom-ci \
              -c "permissions.axiom-ci.filesystem=$filesystem" \
              -c "permissions.axiom-ci.network.enabled=$network_enabled" \
              -C "$probe_root/allowed" -- /bin/sh -c \
              'test "$(cat "$1")" = ok && test ! -r "$2" && : > "$3"' \
              axiom-ci "$probe_root/allowed/input" "$probe_root/denied/secret" \
              "$probe_root/allowed/output"
            test -f "$probe_root/allowed/output"
          ) 2>&1 | tee "$diagnostic_log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            if [[ "$RUNNER_OS" == Linux ]] \
              && grep -Eq \
                'bwrap: (loopback: Failed RTM_NEWADDR: Operation not permitted|setting up uid map: Permission denied)' \
                "$diagnostic_log"; then
              echo "::warning title=Hosted Linux sandbox limitation::GitHub's hosted runner denied bubblewrap namespace setup; repository tests will continue. Run /ready on the deployment host before any paid work."
              exit 0
            fi
            python - "$diagnostic_log" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )[-12000:]
          escaped = (
              text.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title=Codex sandbox probe::{escaped}")
          PY
            exit "$status"
          fi

      - name: Run platform-sensitive tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          run_test() {
            local label="$1"
            shift
            local diagnostic_log="$RUNNER_TEMP/${label}.log"
            set +e
            "$@" 2>&1 | tee "$diagnostic_log"
            local status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then
              python - "$diagnostic_log" "$label" <<'PY'
          import pathlib
          import sys

          text = pathlib.Path(sys.argv[1]).read_text(
              encoding="utf-8", errors="replace"
          )[-12000:]
          escaped = (
              text.replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
          )
          print(f"::error title={sys.argv[2]}::{escaped}")
          PY
              return 1
            fi
            return 0
          }
          run_test verification-api \
            agents/verification/.venv/bin/python -m pytest -q \
            agents/verification/tests/test_api_server.py &
          verification_api_pid=$!
          run_test claude-core \
            agents/.generation-venv/bin/python -m pytest -q \
            agents/generation/tests/test_claude_core.py &
          claude_core_pid=$!
          run_test verification-client \
            agents/.generation-venv/bin/python -m pytest -q \
            agents/generation/tests/test_verification_client.py &
          verification_client_pid=$!
          run_test runner-mock \
            agents/.generation-venv/bin/python -m pytest -q \
            agents/generation/tests/test_runner_mock.py &
          runner_mock_pid=$!
          failures=0
          for test_pid in \
            "$verification_api_pid" \
            "$claude_core_pid" \
            "$verification_client_pid" \
            "$runner_mock_pid"; do
            if ! wait "$test_pid"; then
              failures=1
            fi
          done
          exit "$failures"
